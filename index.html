<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Note Party">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7b2cbf">
<title>Note Party — For Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif;background:#1a0a2e;color:#fff;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:none;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}

/* ===== START SCREEN ===== */
#start{
  position:absolute;inset:0;z-index:100;
  background:radial-gradient(ellipse at 50% 30%,#5b21b6 0%,#2e1065 45%,#0f0520 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
#start.hidden{display:none}
#sparkle-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sparkle{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:#fff;box-shadow:0 0 8px 2px #ffe66d,0 0 16px #ff9ecd;
  animation:twinkle var(--d,2s) ease-in-out infinite;
  opacity:0;
}
.star-twinkle{
  position:absolute;font-size:18px;opacity:0;
  animation:starPulse var(--d,2.5s) ease-in-out infinite;
  filter:drop-shadow(0 0 6px #ffe66d);
}
.glow-float{
  position:absolute;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,230,109,.45),transparent 70%);
  animation:floatGlow var(--d,6s) ease-in-out infinite;
  pointer-events:none;
}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}40%,60%{opacity:1;transform:scale(1.2)}}
@keyframes starPulse{0%,100%{opacity:.2;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.3) rotate(20deg)}}
@keyframes floatGlow{0%,100%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-40px) scale(1.3);opacity:.8}}

.start-content{position:relative;z-index:2;text-align:center;padding:24px;max-width:520px}
.logo{
  font-size:clamp(42px,12vw,72px);font-weight:700;letter-spacing:1px;
  background:linear-gradient(135deg,#ffe66d,#ff9ecd,#a78bfa,#67e8f9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 4px 12px rgba(255,158,205,.5));
  margin-bottom:8px;animation:logoBob 2.5s ease-in-out infinite;
}
@keyframes logoBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.subtitle{font-size:clamp(16px,4vw,22px);color:#e9d5ff;margin-bottom:28px;opacity:.9}

.dedication{
  font-size:clamp(22px,6vw,36px);font-weight:600;color:#ffe66d;
  text-shadow:0 0 12px rgba(255,230,109,.8),0 0 28px rgba(255,158,205,.5),0 2px 0 #c026d3;
  margin:16px 0 8px;padding:12px 20px;
  animation:shimmer 3s ease-in-out infinite;
  line-height:1.35;
}
.dedication .heart{display:inline-block;animation:heartBeat 1.2s ease-in-out infinite;font-size:1.1em}
@keyframes shimmer{
  0%,100%{filter:brightness(1);text-shadow:0 0 12px rgba(255,230,109,.8),0 0 28px rgba(255,158,205,.5),0 2px 0 #c026d3}
  50%{filter:brightness(1.25);text-shadow:0 0 20px rgba(255,230,109,1),0 0 40px rgba(255,158,205,.8),0 2px 0 #c026d3}
}
@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

.mascot-row{display:flex;justify-content:center;gap:18px;margin:20px 0 28px;flex-wrap:wrap}
.mascot{
  width:72px;height:88px;position:relative;
  animation:danceBob 1.1s ease-in-out infinite;
}
.mascot:nth-child(2){animation-delay:.2s}
.mascot:nth-child(3){animation-delay:.4s}
@keyframes danceBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}

.play-btn{
  display:inline-block;padding:18px 56px;font-size:clamp(24px,6vw,32px);font-weight:700;
  color:#1a0a2e;background:linear-gradient(180deg,#ffe66d,#fbbf24);
  border-radius:999px;box-shadow:0 6px 0 #d97706,0 10px 24px rgba(251,191,36,.45);
  transition:transform .1s;animation:pulsePlay 2s ease-in-out infinite;
}
.play-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d97706,0 4px 12px rgba(251,191,36,.4)}
@keyframes pulsePlay{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

/* ===== HUD ===== */
#hud{
  position:absolute;top:0;left:0;right:0;z-index:50;
  display:none;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;
  background:linear-gradient(180deg,rgba(26,10,46,.85),transparent);
  pointer-events:none;
}
#hud.show{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hud-pill{
  pointer-events:auto;background:rgba(91,33,182,.85);backdrop-filter:blur(8px);
  border:2px solid rgba(255,230,109,.4);border-radius:999px;
  padding:8px 14px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.hud-pill button{background:transparent;color:#ffe66d;font-size:14px;font-weight:700;padding:4px 8px}
#prize-shelf{
  pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;max-width:min(100%,340px);
  background:rgba(15,5,32,.75);border-radius:16px;padding:6px 8px;
  border:2px solid rgba(255,158,205,.35);
}
.prize-slot{
  width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;font-size:16px;
  border:1px dashed rgba(255,255,255,.2);
}
.prize-slot.filled{background:linear-gradient(135deg,#7c3aed,#db2777);border-style:solid;border-color:#ffe66d;animation:prizePop .4s ease}
@keyframes prizePop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ===== WORLD ===== */
#world-wrap{
  position:absolute;inset:0;overflow:hidden;display:none;
  background:linear-gradient(180deg,#67e8f9 0%,#a5f3fc 30%,#86efac 55%,#4ade80 100%);
}
#world-wrap.show{display:block}
#world{
  position:absolute;width:1600px;height:1100px;
  transform-origin:0 0;
  cursor:grab;
}
#world.dragging{cursor:grabbing}
.sky-cloud{
  position:absolute;background:rgba(255,255,255,.85);border-radius:40px;
  box-shadow:30px 0 0 rgba(255,255,255,.85),-25px 8px 0 rgba(255,255,255,.7);
  animation:cloudDrift linear infinite;
}
@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(80px)}}

.hill{
  position:absolute;border-radius:50% 50% 0 0;
  background:linear-gradient(180deg,#4ade80,#22c55e);
}
.tree{position:absolute;width:50px;height:70px}
.tree-top{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  width:48px;height:48px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#86efac,#16a34a);
  box-shadow:0 0 0 4px #15803d inset;
}
.tree-trunk{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:12px;height:24px;background:#92400e;border-radius:3px;
}
.hut{
  position:absolute;width:90px;height:80px;
}
.hut-body{
  position:absolute;bottom:0;left:8px;right:8px;height:48px;
  border-radius:8px 8px 4px 4px;
  background:linear-gradient(180deg,var(--hut,#f472b6),color-mix(in srgb,var(--hut,#f472b6) 70%,#000));
  border:3px solid rgba(0,0,0,.15);
}
.hut-roof{
  position:absolute;bottom:42px;left:0;right:0;height:0;
  border-left:45px solid transparent;border-right:45px solid transparent;
  border-bottom:36px solid var(--roof,#7c3aed);
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));
}
.hut-door{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:22px;height:28px;background:#78350f;border-radius:10px 10px 0 0;
}
.hut-window{
  position:absolute;bottom:22px;width:14px;height:14px;border-radius:50%;
  background:#fef08a;box-shadow:0 0 8px #fde047;border:2px solid rgba(0,0,0,.2);
}
.path{
  position:absolute;background:rgba(217,119,6,.35);border-radius:20px;
  transform-origin:center;
}

/* Concert stage */
.stage{
  position:absolute;width:320px;height:200px;
  left:640px;top:380px;
}
.stage-floor{
  position:absolute;bottom:0;left:20px;right:20px;height:50px;
  background:linear-gradient(180deg,#a78bfa,#7c3aed);
  border-radius:12px;border:3px solid #5b21b6;
  box-shadow:0 8px 0 #4c1d95,0 12px 24px rgba(0,0,0,.3);
}
.stage-back{
  position:absolute;bottom:48px;left:40px;right:40px;height:100px;
  background:linear-gradient(180deg,#c026d3,#7c3aed);
  border-radius:16px 16px 0 0;border:3px solid #86198f;
}
.stage-lights{
  position:absolute;bottom:140px;left:50px;right:50px;display:flex;justify-content:space-around;
}
.stage-light{
  width:14px;height:14px;border-radius:50%;
  background:#ffe66d;box-shadow:0 0 12px #ffe66d;
  animation:lightBlink 1.5s ease-in-out infinite;
}
.stage-light:nth-child(2){animation-delay:.3s;background:#67e8f9;box-shadow:0 0 12px #67e8f9}
.stage-light:nth-child(3){animation-delay:.6s;background:#ff9ecd;box-shadow:0 0 12px #ff9ecd}
.stage-light:nth-child(4){animation-delay:.9s;background:#86efac;box-shadow:0 0 12px #86efac}
@keyframes lightBlink{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.stage-label{
  position:absolute;bottom:58px;left:0;right:0;text-align:center;
  font-size:18px;font-weight:700;color:#ffe66d;text-shadow:0 2px 4px rgba(0,0,0,.4);
}
.song-slots{
  position:absolute;bottom:12px;left:40px;right:40px;display:flex;justify-content:center;gap:8px;
}
.song-slot{
  width:36px;height:28px;border-radius:8px;background:rgba(0,0,0,.25);
  border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:16px;
}
.song-slot.lit{background:linear-gradient(135deg,#ffe66d,#f472b6);border-style:solid;border-color:#fff;animation:prizePop .4s}
.dancer{
  position:absolute;bottom:52px;width:36px;height:48px;opacity:.35;transition:opacity .4s;
}
.dancer.active{opacity:1;animation:danceBob .8s ease-in-out infinite}
.dancer:nth-child(1){left:70px}.dancer:nth-child(2){left:140px;animation-delay:.15s}.dancer:nth-child(3){left:210px;animation-delay:.3s}
.sing-btn{
  position:absolute;bottom:-48px;left:50%;transform:translateX(-50%);
  padding:12px 24px;font-size:16px;font-weight:700;border-radius:999px;
  background:linear-gradient(180deg,#ff9ecd,#db2777);color:#fff;
  box-shadow:0 4px 0 #9d174d;display:none;white-space:nowrap;
}
.sing-btn.show{display:block}

/* Notes */
.note-spot{
  position:absolute;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#ffe66d 40%,#f59e0b);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 0 20px rgba(255,230,109,.8),0 4px 0 #d97706;
  animation:notePulse 1.6s ease-in-out infinite;cursor:pointer;z-index:5;
}
.note-spot.collected{opacity:0;pointer-events:none;transform:scale(0);transition:all .5s}
@keyframes notePulse{0%,100%{transform:scale(1);box-shadow:0 0 16px rgba(255,230,109,.7),0 4px 0 #d97706}50%{transform:scale(1.12);box-shadow:0 0 28px rgba(255,230,109,1),0 4px 0 #d97706}}

/* Troll villagers */
.troll{
  position:absolute;width:70px;height:95px;cursor:pointer;z-index:6;
  animation:trollBounce 2s ease-in-out infinite;
}
.troll:nth-child(odd){animation-duration:2.3s}
@keyframes trollBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.troll-body{
  position:absolute;bottom:8px;left:10px;width:50px;height:55px;border-radius:50% 50% 40% 40%;
  background:var(--skin,#67e8f9);
  box-shadow:inset -6px -8px 0 rgba(0,0,0,.08);
}
.troll-hair{
  position:absolute;top:0;left:8px;width:54px;height:36px;border-radius:50% 50% 40% 40%;
  background:var(--hair,#f472b6);
  box-shadow:-12px 8px 0 -4px var(--hair,#f472b6),12px 8px 0 -4px var(--hair,#f472b6),0 -6px 0 -2px var(--hair,#f472b6);
}
.troll-eye{
  position:absolute;bottom:42px;width:12px;height:14px;background:#fff;border-radius:50%;
  border:2px solid #1a0a2e;
}
.troll-eye::after{
  content:'';position:absolute;top:4px;left:3px;width:5px;height:5px;background:#1a0a2e;border-radius:50%;
}
.troll-eye.l{left:18px}.troll-eye.r{right:18px}
.troll-smile{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  width:18px;height:10px;border:3px solid #1a0a2e;border-top:none;border-radius:0 0 12px 12px;
}
.troll-arm{
  position:absolute;bottom:40px;width:12px;height:28px;border-radius:8px;background:var(--skin,#67e8f9);
  animation:waveArm 1.5s ease-in-out infinite;
}
.troll-arm.l{left:0;transform-origin:top center}
.troll-arm.r{right:0;transform-origin:top center;animation-delay:.2s}
@keyframes waveArm{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(25deg)}}
.cheer-chip{
  position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
  background:#fff;color:#7c3aed;padding:8px 12px;border-radius:12px;
  font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 12px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;
  max-width:160px;white-space:normal;text-align:center;z-index:20;
}
.cheer-chip.show{opacity:1}

/* ===== CHALLENGE MODAL ===== */
#challenge{
  position:absolute;inset:0;z-index:80;display:none;
  background:rgba(15,5,32,.72);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:16px;
}
#challenge.show{display:flex}
.chal-card{
  background:linear-gradient(160deg,#5b21b6,#2e1065);
  border:3px solid #ffe66d;border-radius:28px;
  padding:24px 20px;max-width:440px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  text-align:center;max-height:90vh;overflow-y:auto;
}
.chal-type{
  display:inline-block;padding:4px 14px;border-radius:999px;font-size:13px;font-weight:600;
  background:rgba(255,230,109,.2);color:#ffe66d;margin-bottom:12px;
}
.chal-prompt{font-size:clamp(18px,4.5vw,24px);font-weight:600;margin-bottom:8px;line-height:1.3;color:#fce7f3}
.chal-say{
  font-size:14px;color:#c4b5fd;margin-bottom:16px;
  background:rgba(167,139,250,.2);padding:8px 12px;border-radius:12px;display:inline-block;
}
.chal-word{
  font-size:clamp(40px,12vw,64px);font-weight:700;color:#ffe66d;
  text-shadow:0 0 20px rgba(255,230,109,.5);margin:12px 0 20px;letter-spacing:1px;
}
.chal-sentence{
  font-size:clamp(22px,5.5vw,32px);font-weight:600;color:#fff;
  background:rgba(0,0,0,.25);padding:16px;border-radius:16px;margin:12px 0 20px;line-height:1.4;
}
.obj-row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:12px 0 16px;min-height:40px}
.obj{width:28px;height:28px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center}
.place-viz{display:flex;justify-content:center;gap:24px;margin:16px 0}
.place-box{
  background:rgba(0,0,0,.25);border-radius:16px;padding:12px 18px;min-width:100px;
}
.place-box h4{font-size:14px;color:#c4b5fd;margin-bottom:8px}
.place-box .num{font-size:36px;font-weight:700;color:#ffe66d}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
.choice-btn{
  min-width:72px;min-height:64px;padding:12px 18px;font-size:clamp(20px,5vw,28px);font-weight:700;
  border-radius:18px;background:linear-gradient(180deg,#a78bfa,#7c3aed);color:#fff;
  box-shadow:0 5px 0 #5b21b6;transition:transform .1s;
}
.choice-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5b21b6}
.choice-btn.correct{background:linear-gradient(180deg,#86efac,#22c55e);box-shadow:0 5px 0 #15803d}
.choice-btn.wrong{background:linear-gradient(180deg,#fca5a5,#ef4444);box-shadow:0 5px 0 #b91c1c;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.chal-feedback{margin-top:14px;font-size:18px;font-weight:600;min-height:28px}
.chal-feedback.good{color:#86efac}.chal-feedback.bad{color:#fca5a5}

/* Particles */
#particles{position:absolute;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.particle{
  position:absolute;font-size:20px;animation:flyOut 1s ease-out forwards;pointer-events:none;
}
@keyframes flyOut{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3)}}

/* ===== SING-ALONG ===== */
#singalong{
  position:absolute;inset:0;z-index:85;display:none;
  background:linear-gradient(180deg,#2e1065,#0f0520);
  flex-direction:column;align-items:center;justify-content:center;padding:20px;
}
#singalong.show{display:flex}
.sing-title{font-size:28px;font-weight:700;color:#ffe66d;margin-bottom:8px}
.sing-hint{font-size:16px;color:#c4b5fd;margin-bottom:24px;text-align:center}
.beat-lane{
  width:min(90vw,360px);height:200px;position:relative;
  background:rgba(124,58,237,.3);border-radius:24px;border:3px solid #a78bfa;
  overflow:hidden;margin-bottom:20px;
}
.beat-target{
  position:absolute;bottom:24px;left:50%;transform:translateX(-50%);
  width:80px;height:80px;border-radius:50%;
  border:4px solid #ffe66d;background:rgba(255,230,109,.15);
  box-shadow:0 0 20px rgba(255,230,109,.4);
}
.beat-note{
  position:absolute;left:50%;width:64px;height:64px;margin-left:-32px;
  border-radius:50%;background:linear-gradient(135deg,#ff9ecd,#a78bfa);
  display:flex;align-items:center;justify-content:center;font-size:28px;
  box-shadow:0 0 16px rgba(255,158,205,.6);
}
.beat-hit-btn{
  width:100px;height:100px;border-radius:50%;font-size:40px;
  background:linear-gradient(180deg,#ffe66d,#fbbf24);color:#1a0a2e;
  box-shadow:0 6px 0 #d97706,0 0 30px rgba(255,230,109,.5);
  animation:beatPulse .5s ease-in-out infinite;font-weight:700;
}
@keyframes beatPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.beat-hit-btn:active{transform:scale(.92);box-shadow:0 2px 0 #d97706}
.sing-score{font-size:20px;margin:16px 0;color:#fff}
.sing-close{
  margin-top:12px;padding:12px 28px;border-radius:999px;font-size:16px;font-weight:600;
  background:rgba(255,255,255,.15);color:#fff;
}

/* ===== CELEBRATION ===== */
#celeb{
  position:absolute;inset:0;z-index:95;display:none;
  background:radial-gradient(ellipse at center,#7c3aed 0%,#1a0a2e 70%);
  flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden;
}
#celeb.show{display:flex}
.luna-lights{
  font-size:clamp(48px,14vw,80px);font-weight:700;letter-spacing:8px;
  background:linear-gradient(90deg,#ffe66d,#ff9ecd,#67e8f9,#ffe66d);
  background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:lightMarquee 2s linear infinite,logoBob 2s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(255,230,109,.8));
  margin-bottom:12px;
}
@keyframes lightMarquee{to{background-position:200% center}}
.trophy{font-size:80px;margin:12px 0;animation:danceBob 1s ease-in-out infinite;filter:drop-shadow(0 0 20px #ffe66d)}
.celeb-msg{font-size:clamp(20px,5vw,28px);text-align:center;color:#fce7f3;margin:8px 0 20px;line-height:1.4}
.celeb-prizes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:24px;max-width:360px}
.celeb-prizes span{
  width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;

<script>
(function(){
'use strict';

/* ===== AUDIO ===== */
let audioCtx=null;
function ensureAudio(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function tone(freq,dur,type,vol){
  try{
    const ctx=ensureAudio();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=vol||0.12;
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function chimeGood(){tone(523,.12,'sine',.14);setTimeout(()=>tone(659,.12,'sine',.14),80);setTimeout(()=>tone(784,.2,'sine',.12),160)}
function chimeBad(){tone(220,.2,'triangle',.1);setTimeout(()=>tone(180,.25,'triangle',.08),120)}
function chimePrize(){tone(392,.1);setTimeout(()=>tone(523,.1),70);setTimeout(()=>tone(659,.1),140);setTimeout(()=>tone(784,.25),210)}
function chimeClick(){tone(880,.05,'square',.06)}

/* ===== DATA ===== */
const PRIZES=[
  {id:'wig',emoji:'💇',name:'Rainbow Wig'},
  {id:'guitar',emoji:'🎸',name:'Tiny Guitar'},
  {id:'disco',emoji:'🪩',name:'Disco Ball'},
  {id:'foam',emoji:'☝️',name:'Foam Finger'},
  {id:'mic',emoji:'🎙️',name:'Star Mic'},
  {id:'balloon',emoji:'🎈',name:'Balloon'},
  {id:'moon',emoji:'🌙',name:'Moon'},
  {id:'crown',emoji:'👑',name:'Crown'},
  {id:'heart',emoji:'💖',name:'Heart'},
  {id:'drum',emoji:'🥁',name:'Drum'}
];

const CHEERS=[
  'You got this, Luna! 🌟','Sing it loud! 🎤','Dance break! 💃',
  'Super star! ⭐','Try saying it out loud!','Trolls believe in you!',
  'Beat those notes! 🎵','Rainbow high-five! 🌈','Keep bouncing! 🎉'
];

const CHALLENGES=[
  // Reading: two-syllable / harder sight
  {kind:'read-word',type:'Reading',prompt:'Say this word out loud, then tap it!',word:'happy',choices:['happy','hoppy','hippo'],answer:'happy'},
  {kind:'read-word',type:'Reading',prompt:'Big word time! Say it, then tap!',word:'under',choices:['under','uncle','over'],answer:'under'},
  {kind:'read-word',type:'Reading',prompt:'Read it loud!',word:'sister',choices:['sister','mister','sitter'],answer:'sister'},
  // Blends
  {kind:'blend',type:'Reading · Blend',prompt:'Which word starts with bl?',word:'bl',choices:['blue','true','stew'],answer:'blue'},
  {kind:'blend',type:'Reading · Blend',prompt:'Which word starts with st?',word:'st',choices:['star','trap','blob'],answer:'star'},
  {kind:'blend',type:'Reading · Blend',prompt:'Which word starts with tr?',word:'tr',choices:['tree','bee','sleep'],answer:'tree'},
  // Sentences
  {kind:'sentence',type:'Reading · Sentence',prompt:'Read the sentence out loud, then pick what it says.',sentence:'The cat sat on the mat.',choices:['The cat sat on the mat.','The dog ran to the park.','A bird flew up high.'],answer:'The cat sat on the mat.'},
  {kind:'sentence',type:'Reading · Sentence',prompt:'Read it out loud!',sentence:'We like to sing and dance.',choices:['We like to sing and dance.','I can hop on one foot.','She has a red balloon.'],answer:'We like to sing and dance.'},
  // Math: add/sub within 20 with pictures
  {kind:'math-pic',type:'Math · Add',prompt:'How many in all? Count the pictures, then tap the answer.',op:'+',a:7,b:5,emoji:'🍬'},
  {kind:'math-pic',type:'Math · Subtract',prompt:'How many are left?',op:'-',a:12,b:4,emoji:'⭐'},
  {kind:'math-pic',type:'Math · Add',prompt:'Add them up!',op:'+',a:9,b:8,emoji:'🎈'},
  {kind:'math-pic',type:'Math · Subtract',prompt:'Take some away — how many left?',op:'-',a:15,b:6,emoji:'🍀'},
  // Two-digit + one-digit no regrouping
  {kind:'math-2d',type:'Math · Add',prompt:'Add the ones — no carrying!',a:12,b:5},
  {kind:'math-2d',type:'Math · Add',prompt:'Add these numbers!',a:23,b:4},
  {kind:'math-2d',type:'Math · Add',prompt:'What is the sum?',a:31,b:7},
  // Place value
  {kind:'place',type:'Math · Place Value',prompt:'How many tens and ones?',num:27},
  {kind:'place',type:'Math · Place Value',prompt:'Look at the number — tens & ones!',num:45},
  {kind:'place',type:'Math · Place Value',prompt:'Find the tens and ones!',num:18}
];

/* Pick 10 unique challenges: mix reading + math */
function pickChallenges(){
  const reading=CHALLENGES.filter(c=>c.type.startsWith('Reading'));
  const math=CHALLENGES.filter(c=>c.type.startsWith('Math'));
  shuffle(reading); shuffle(math);
  const picks=[...reading.slice(0,5),...math.slice(0,5)];
  shuffle(picks);
  return picks;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===== STATE ===== */

    <circle cx="26" cy="52" r="7" fill="#fff" stroke="#1a0a2e" stroke-width="2"/>
    <circle cx="44" cy="52" r="7" fill="#fff" stroke="#1a0a2e" stroke-width="2"/>
    <circle cx="27" cy="53" r="3" fill="#1a0a2e"/>
    <circle cx="45" cy="53" r="3" fill="#1a0a2e"/>
    <path d="M28 64 Q35 72 42 64" fill="none" stroke="#1a0a2e" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

/* ===== WORLD BUILD ===== */
const NOTE_POS=[
  [180,520],[320,280],[480,640],[560,200],[720,720],

];
const TROLL_POS=[
  [220,400,'#67e8f9','#ec4899'],
  [450,500,'#fde047','#8b5cf6'],
  [900,480,'#86efac','#f472b6'],
  [1100,620,'#fda4af','#22d3ee'],
  [1300,280,'#c4b5fd','#f97316']
];

function buildWorld(){
  const world=document.getElementById('world');
  world.innerHTML='';

  // Clouds
  for(let i=0;i<6;i++){

    c.className='sky-cloud';

  // Hills

  // Trees

  stage.innerHTML=`

      <div class="dancer" id="dancer0">${trollSVG('#ff9ecd','#a78bfa',36)}</div>
      <div class="dancer" id="dancer1">${trollSVG('#67e8f9','#f472b6',36)}</div>

      <div class="stage-label">🎤 Concert Stage</div>
    </div>
    <div class="stage-floor">
      <div class="song-slots" id="song-slots"></div>
    </div>
    <button class="sing-btn" id="stage-sing-btn" type="button">🎤 Sing Along!</button>
  `;
  world.appendChild(stage);

  const slots=stage.querySelector('#song-slots');
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='song-slot';
    s.id='slot'+i;
    s.textContent='♪';
    slots.appendChild(s);
  }

  // Notes
  NOTE_POS.forEach((pos,i)=>{
    const n=document.createElement('div');
    n.className='note-spot';
    n.dataset.idx=i;
    n.style.left=pos[0]+'px';
    n.style.top=pos[1]+'px';
    n.style.animationDelay=(i*0.15)+'s';
    n.textContent='🎵';
    n.addEventListener('click',e=>{e.stopPropagation(); onNoteTap(i,n)});
    world.appendChild(n);
  });

  // Troll villagers
  TROLL_POS.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='troll';
    el.style.left=t[0]+'px';
    el.style.top=t[1]+'px';
    el.style.setProperty('--skin',t[2]);
    el.style.setProperty('--hair',t[3]);
    el.style.animationDelay=(i*0.3)+'s';
    el.innerHTML=`
      <div class="cheer-chip" id="cheer${i}"></div>

      <div class="troll-arm r"></div>
      <div class="troll-body"></div>

      <div class="troll-eye r"></div>
      <div class="troll-smile"></div>
    `;
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const chip=el.querySelector('.cheer-chip');
      chip.textContent=CHEERS[Math.floor(Math.random()*CHEERS.length)];
      chip.classList.add('show');
      tone(660,.1,'sine',.1);
      setTimeout(()=>chip.classList.remove('show'),2200);
    });
    world.appendChild(el);
  });

  setupPan();
  // Center on stage initially
  panTo(640,380);
}

/* Pan / scroll */
let panX=0,panY=0,dragging=false,lastTX=0,lastTY=0;
function setupPan(){
  const wrap=document.getElementById('world-wrap');
  const world=document.getElementById('world');
  function apply(){
    const scale=Math.min(1, Math.max(wrap.clientWidth/1600, wrap.clientHeight/1100)*1.15);
    const maxX=0, minX=wrap.clientWidth-1600*scale;
    const maxY=0, minY=wrap.clientHeight-1100*scale;
    panX=Math.min(maxX,Math.max(minX,panX));
    panY=Math.min(maxY,Math.max(minY,panY));
    world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
  }
  window._applyPan=apply;
  apply();
  window.addEventListener('resize',apply);

  wrap.addEventListener('pointerdown',e=>{
    if(e.target.closest('.note-spot,.troll,.sing-btn,button')) return;
    dragging=true; lastTX=e.clientX; lastTY=e.clientY;
    world.classList.add('dragging');
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',e=>{
    if(!dragging) return;
    panX+=e.clientX-lastTX; panY+=e.clientY-lastTY;
    lastTX=e.clientX; lastTY=e.clientY;
    apply();
  });
  wrap.addEventListener('pointerup',()=>{dragging=false;world.classList.remove('dragging')});
  wrap.addEventListener('pointercancel',()=>{dragging=false;world.classList.remove('dragging')});
}
function panTo(wx,wy){
  const wrap=document.getElementById('world-wrap');
  const scale=Math.min(1, Math.max(wrap.clientWidth/1600, wrap.clientHeight/1100)*1.15);
  panX=wrap.clientWidth/2 - wx*scale;
  panY=wrap.clientHeight/2 - wy*scale;
  if(window._applyPan) window._applyPan();
}

/* ===== HUD / PRIZES ===== */
function renderShelf(){
  const shelf=document.getElementById('prize-shelf');
  shelf.innerHTML='';
  for(let i=0;i<10;i++){
    const slot=document.createElement('div');
    slot.className='prize-slot'+(state.prizes[i]?' filled':'');
    slot.textContent=state.prizes[i]?PRIZES[i].emoji:'';
    slot.title=state.prizes[i]?PRIZES[i].name:'';
    shelf.appendChild(slot);
  }
  document.getElementById('progress-text').textContent=state.notesCollected+' of 10';
}
function updateStage(){
  for(let i=0;i<10;i++){
    const slot=document.getElementById('slot'+i);
    if(slot) slot.classList.toggle('lit', i<state.notesCollected);
  }
  const dancers=Math.min(3, Math.floor(state.notesCollected/3));
  for(let i=0;i<3;i++){
    const d=document.getElementById('dancer'+i);
    if(d) d.classList.toggle('active', i<dancers);
  }
  const singBtn=document.getElementById('stage-sing-btn');
  const hudSing=document.getElementById('sing-hud-btn');
  if(state.notesCollected>=3){
    if(singBtn) singBtn.classList.add('show');
    if(hudSing) hudSing.style.display='inline';
  }
}

/* ===== CHALLENGES ===== */
function onNoteTap(idx,el){
  if(state.noteDone[idx]) return;
  ensureAudio();
  openChallenge(idx,el);
}

function openChallenge(idx,el){
  const chal=state.challenges[idx];
  const card=document.getElementById('chal-card');
  const modal=document.getElementById('challenge');
  let html=`<div class="chal-type">${chal.type}</div>`;
  html+=`<div class="chal-prompt">${chal.prompt}</div>`;
  html+=`<div class="chal-say">🗣️ Say it out loud — then tap your answer!</div>`;

  if(chal.kind==='read-word'||chal.kind==='blend'){
    html+=`<div class="chal-word">${chal.kind==='blend'?chal.word+'…':chal.word}</div>`;
  } else if(chal.kind==='sentence'){
    html+=`<div class="chal-sentence">${chal.sentence}</div>`;
  } else if(chal.kind==='math-pic'){
    const showA=chal.a, showB=chal.op==='-'?chal.b:chal.b;
    html+=`<div class="obj-row" id="obj-a"></div>`;
    html+=`<div style="font-size:32px;font-weight:700;color:#ffe66d;margin:4px">${chal.op==='+'?'+':'−'}</div>`;
    html+=`<div class="obj-row" id="obj-b"></div>`;
    html+=`<div style="font-size:28px;margin:8px;color:#c4b5fd">${chal.a} ${chal.op==='+'?'+':'−'} ${chal.b} = ?</div>`;
  } else if(chal.kind==='math-2d'){
    html+=`<div class="chal-word">${chal.a} + ${chal.b}</div>`;
  } else if(chal.kind==='place'){
    const tens=Math.floor(chal.num/10), ones=chal.num%10;
    html+=`<div class="chal-word">${chal.num}</div>`;
    html+=`<div class="place-viz">
      <div class="place-box"><h4>Tens</h4><div class="num">?</div></div>
      <div class="place-box"><h4>Ones</h4><div class="num">?</div></div>
    </div>`;
    html+=`<div class="chal-say">Tap the correct tens & ones pair</div>`;
  }

  html+=`<div class="choices" id="chal-choices"></div>`;
  html+=`<div class="chal-feedback" id="chal-fb"></div>`;
  card.innerHTML=html;
  modal.classList.add('show');

  // Picture objects
  if(chal.kind==='math-pic'){
    const ea=document.getElementById('obj-a'), eb=document.getElementById('obj-b');
    for(let i=0;i<chal.a;i++){const s=document.createElement('div');s.className='obj';s.textContent=chal.emoji;ea.appendChild(s)}
    const bCount=chal.op==='+'?chal.b:chal.b;
    for(let i=0;i<bCount;i++){const s=document.createElement('div');s.className='obj';s.textContent=chal.op==='-'?'💨':chal.emoji;eb.appendChild(s)}
  }

  // Build choices
  const choicesEl=document.getElementById('chal-choices');
  let choices, answer;
  if(chal.kind==='read-word'||chal.kind==='blend'||chal.kind==='sentence'){
    choices=[...chal.choices]; answer=chal.answer;
  } else if(chal.kind==='math-pic'){
    answer=chal.op==='+'?(chal.a+chal.b):(chal.a-chal.b);
    choices=makeNumChoices(answer,0,20);
  } else if(chal.kind==='math-2d'){
    answer=chal.a+chal.b;
    choices=makeNumChoices(answer,10,50);
  } else if(chal.kind==='place'){
    const tens=Math.floor(chal.num/10), ones=chal.num%10;
    answer=`${tens} tens, ${ones} ones`;
    choices=shuffle([
      answer,
      `${ones} tens, ${tens} ones`,
      `${tens+1} tens, ${Math.max(0,ones-1)} ones`,
      `${Math.max(0,tens-1)} tens, ${ones+1} ones`
    ]);
  }
  shuffle(choices);
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='choice-btn';
    btn.textContent=c;
    btn.addEventListener('click',()=>onAnswer(btn,c,answer,idx,el));
    choicesEl.appendChild(btn);
  });
}

function makeNumChoices(ans,lo,hi){
  const set=new Set([ans]);
  while(set.size<4){
    let n=ans+(Math.floor(Math.random()*7)-3);
    if(n===ans||n<lo||n>hi||n<0) n=lo+Math.floor(Math.random()*(hi-lo+1));
    if(n!==ans&&n>=0) set.add(n);
  }
  return [...set];
}

function onAnswer(btn,choice,answer,idx,el){
  const fb=document.getElementById('chal-fb');
  const correct=String(choice)===String(answer);
  if(correct){
    btn.classList.add('correct');
    fb.textContent='Yes! Great job, Luna! 🌟';
    fb.className='chal-feedback good';
    chimeGood();
    burst(btn);
    document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
    setTimeout(()=>{
      document.getElementById('challenge').classList.remove('show');
      collectNote(idx,el);
    },900);
  } else {
    btn.classList.add('wrong');
    fb.textContent='Almost — try again! You can do it! 💪';
    fb.className='chal-feedback bad';
    chimeBad();
    setTimeout(()=>btn.classList.remove('wrong'),500);
  }
}

function collectNote(idx,el){
  state.noteDone[idx]=true;
  state.notesCollected++;
  state.prizes.push(PRIZES[state.notesCollected-1]);
  el.classList.add('collected');
  chimePrize();
  renderShelf();
  updateStage();
  burst(el,true);
  if(state.notesCollected>=10){
    setTimeout(showCelebration,800);
  }
}

function burst(el,big){
  const layer=document.getElementById('particles');
  const r=el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:40,height:40};
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  const emojis=big?['✨','⭐','🎉','💖','🌟','🎵']:['✨','⭐','💫'];
  for(let i=0;i<(big?16:8);i++){
    const p=document.createElement('div');
    p.className='particle';
    p.textContent=emojis[i%emojis.length];
    p.style.left=cx+'px'; p.style.top=cy+'px';
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*(big?120:60);
    p.style.setProperty('--tx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--ty',Math.sin(ang)*dist+'px');
    layer.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }
}

/* ===== SING-ALONG ===== */
let singTimer=null, beatNotes=[];
function openSing(){
  ensureAudio();
  document.getElementById('singalong').classList.add('show');
  state.singing=true;
  state.singHits=0;
  document.getElementById('sing-score').textContent='Hits: 0';
  startBeats();
}
function closeSing(){
  state.singing=false;
  document.getElementById('singalong').classList.remove('show');
  if(singTimer){clearInterval(singTimer);singTimer=null}
  beatNotes.forEach(n=>n.el.remove());
  beatNotes=[];
}
function startBeats(){
  const lane=document.getElementById('beat-lane');
  const speed=180; // px/s roughly via duration
  const duration=2200;
  singTimer=setInterval(()=>{
    if(!state.singing) return;
    const note=document.createElement('div');
    note.className='beat-note';
    note.textContent=['🎵','🎶','💖','⭐'][Math.floor(Math.random()*4)];
    note.style.top='-64px';
    note.style.transition=`top ${duration}ms linear`;
    lane.appendChild(note);
    const entry={el:note,born:Date.now(),hit:false};
    beatNotes.push(entry);
    requestAnimationFrame(()=>{note.style.top='140px'});
    chimeClick();
    setTimeout(()=>{
      if(!entry.hit){note.style.opacity='0.3'}
      setTimeout(()=>{note.remove();beatNotes=beatNotes.filter(b=>b!==entry)},300);
    },duration);
  },900);
}
document.getElementById('beat-hit').addEventListener('click',()=>{
  if(!state.singing) return;
  ensureAudio();
  // Hit window: note near target (~ bottom of lane)
  const now=Date.now();
  let best=null,bestDist=999;
  beatNotes.forEach(b=>{
    if(b.hit) return;
    const age=now-b.born;
    const dist=Math.abs(age-1800); // target around 1.8s into 2.2s travel
    if(dist<bestDist){bestDist=dist;best=b}
  });
  if(best&&bestDist<350){
    best.hit=true;
    best.el.style.transform='scale(1.4)';
    best.el.style.opacity='0';
    state.singHits++;
    document.getElementById('sing-score').textContent='Hits: '+state.singHits+(state.singHits>=5?' 🌟 Bonus sparkles!':'');
    chimeGood();
    burst(document.getElementById('beat-hit'));
    if(state.singHits===8){
      // bonus cheer
      const fb=document.getElementById('sing-score');
      fb.textContent='Hits: '+state.singHits+' — Luna rockstar! 🎸';
    }
  } else {
    tone(200,.08,'triangle',.06);
  }
});

/* ===== CELEBRATION ===== */
function showCelebration(){
  const celeb=document.getElementById('celeb');
  const prizes=document.getElementById('celeb-prizes');
  prizes.innerHTML='';
  PRIZES.forEach(p=>{
    const s=document.createElement('span');
    s.textContent=p.emoji;
    s.title=p.name;
    prizes.appendChild(s);
  });
  celeb.classList.add('show');
  launchFireworks();
  chimePrize();
  setTimeout(chimeGood,300);
}
function launchFireworks(){
  const celeb=document.getElementById('celeb');
  const colors=['#ffe66d','#ff9ecd','#67e8f9','#86efac','#a78bfa','#f472b6'];
  for(let wave=0;wave<5;wave++){
    setTimeout(()=>{
      const cx=10+Math.random()*80, cy=15+Math.random()*40;
      for(let i=0;i<20;i++){
        const fw=document.createElement('div');
        fw.className='fw';
        fw.style.left=cx+'%'; fw.style.top=cy+'%';
        fw.style.background=colors[i%colors.length];
        fw.style.boxShadow=`0 0 8px ${colors[i%colors.length]}`;
        const ang=Math.random()*Math.PI*2, dist=30+Math.random()*80;
        fw.style.setProperty('--x',Math.cos(ang)*dist+'px');
        fw.style.setProperty('--y',Math.sin(ang)*dist+'px');
        celeb.appendChild(fw);
        setTimeout(()=>fw.remove(),1200);
      }
      tone(400+Math.random()*400,.15,'sine',.08);
    },wave*400);
  }
}

/* ===== BOOT ===== */
function startGame(){
  ensureAudio();
  state={notesCollected:0,prizes:[],noteDone:{},challenges:pickChallenges(),singing:false,singHits:0};
  document.getElementById('start').classList.add('hidden');
  document.getElementById('celeb').classList.remove('show');
  document.getElementById('world-wrap').classList.add('show');
  document.getElementById('hud').classList.add('show');
  buildWorld();
  renderShelf();
  updateStage();
  document.getElementById('stage-sing-btn').onclick=openSing;
  document.getElementById('sing-hud-btn').onclick=openSing;
}

document.getElementById('play-btn').addEventListener('click',startGame);
document.getElementById('sing-close').addEventListener('click',closeSing);
document.getElementById('again-btn').addEventListener('click',()=>{
  document.getElementById('celeb').classList.remove('show');
  startGame();
});

buildStartFX();

// Prevent iOS bounce scroll
document.addEventListener('touchmove',e=>{
  if(!e.target.closest('.chal-card')) e.preventDefault();
},{passive:false});

})();
</script>
